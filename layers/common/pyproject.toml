[project]
name = "common-layer"
version = "0.1.0"
description = "Shared runtime dependencies for the candidate search Lambdas"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "aws-lambda-powertools[tracer]>=3.24.0",
    "boto3>=1.40.0",
    "psycopg[binary]>=3.3.5",
    "pydantic-settings>=2.12.0",
    "sqlalchemy>=2.0.52",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true
