[project]
name = "css-models"
version = "0.1.0"
description = "SQLAlchemy models for the candidate search database"
requires-python = ">=3.14"
dependencies = [
    "sqlalchemy>=2.0.52",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/css_models"]
