services:
  postgres:
    image: postgres:17
    container_name: candidate-search-service-database-local
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready --username ${DB_USER} --dbname ${DB_NAME}"]
      interval: 2s
      timeout: 2s
      retries: 15
