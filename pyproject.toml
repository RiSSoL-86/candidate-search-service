[project]
name = "candidate-search-service"
version = "0.1.0"
description = "Application code for the candidate search service"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "boto3-stubs~=1.43.93",
    "common-layer",
    "css-models",
]

[tool.uv.workspace]
members = ["cdk", "layers/common", "layers/models"]

[tool.uv.sources]
common-layer = { workspace = true }
css-models = { workspace = true }

[dependency-groups]
dev = [
    "ruff>=0.16.7",
    "mypy>=2.3.1",
    "pre-commit>=4.2.0",
    "pytest>=8.3.5",
]

[tool.ruff]
target-version = "py314"
line-length = 79
src = [
    "cdk",
    "layers/models/python",
    "services/ingest",
    "services/migrations",
]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
]

[tool.mypy]
python_version = "3.14"
plugins = ["pydantic.mypy"]
mypy_path = "cdk"
files = ["cdk", "layers/models/python"]
exclude = ["^cdk/cdk\\.out/", "^services/migrations/alembic/versions/"]
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
ignore_missing_imports = true
